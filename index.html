.device{width:387px;height:836px;border:6px solid #1b1b1f;border-radius:56px;background:#000;position:relative;overflow:hidden;box-shadow:0 25px 65px #0005,0 0 0 1px #5e5b66;flex-shrink:0;isolation:isolate;transform-origin:center}
.device .island{position:absolute;z-index:100;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;pointer-events:none}
.device.full{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
.device.full .island,.device.full .ps .sb,.device.full .ps .hb{display:none}
.device.full .ps{--top:max(env(safe-area-inset-top),14px);--bot:max(env(safe-area-inset-bottom),8px)}
.ps{position:absolute;inset:0;overflow:hidden;background:#000;color:#fff;font-family:var(--pf,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;--top:50px;--bot:26px}
.ps *{box-sizing:border-box;margin:0}
.ps button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ps input{font:inherit;color:inherit;background:none;border:0;outline:0;min-width:0;user-select:text;-webkit-user-select:text}
.ps img{display:block}
.ps .cnt,.ps .tl{position:absolute;inset:0}
.ps .tl{pointer-events:none;z-index:200}.ps .tl>*{pointer-events:auto}
.ps svg{display:block;flex:none}
.ps .wall{position:absolute;inset:0;background:linear-gradient(160deg,#4f7cc2,#d98ab8 55%,#6c4fb0) center/cover}
.ps .shade{position:absolute;inset:0;background:linear-gradient(#0003,transparent 30%,transparent 60%,#0004)}
.ps .blur{position:absolute;inset:0;background:#0009;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.ps .sb{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 32px 0 36px;display:flex;justify-content:space-between;font-size:16px;font-weight:600;z-index:60;pointer-events:none;letter-spacing:-.2px}
.ps .sb .r{display:flex;gap:6px;align-items:center}
.ps .hb{position:absolute;bottom:0;left:0;right:0;height:28px;z-index:70;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;cursor:pointer}
.ps .hb:after{content:"";width:134px;height:5px;border-radius:3px;background:#fff;box-shadow:0 0 6px #0003}
.ps .lk-ic{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center;opacity:.9}
.ps .lk-top{position:absolute;top:88px;left:0;right:0;text-align:center;text-shadow:0 1px 12px #0004}
.ps .lk-date{font-size:20px;font-weight:500;opacity:.92}
.ps .lk-time{font-size:96px;font-weight:600;letter-spacing:-3px;line-height:1;margin-top:0}
.ps .notif,.ps .bn{display:flex;gap:11px;align-items:center;text-align:left;background:rgba(48,48,52,.58);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:22px;padding:12px 14px;box-shadow:0 6px 24px #0003;width:100%}
.ps .notif{position:absolute;left:14px;right:14px;width:auto;bottom:170px;animation:ndrop .55s cubic-bezier(.2,.9,.3,1.2)}
.ps .bn{position:absolute;top:12px;left:10px;right:10px;width:auto;animation:bin .4s cubic-bezier(.2,.9,.3,1.1);transition:transform .4s,opacity .4s}
.ps .bn.out{transform:translateY(-90px);opacity:0}
.ps .n-ic{width:38px;height:38px;border-radius:9px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);display:grid;place-items:center;flex:none}
.ps .n-tx{display:flex;flex-direction:column;flex:1;min-width:0;font-size:14px;line-height:1.3}
.ps .n-tx b{font-weight:600}.ps .n-tx span{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .notif small,.ps .bn small{font-size:12px;opacity:.65;align-self:flex-start}
.ps .lk-btns{position:absolute;bottom:62px;left:0;right:0;padding:0 46px;display:flex;justify-content:space-between}
.ps .rb{width:50px;height:50px;border-radius:50%;background:rgba(40,40,44,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;place-items:center}
.ps .hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:13px;opacity:.75;animation:pulse 2.4s infinite}
.ps .pw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:96px;z-index:5}
.ps .pt{font-size:19px;margin-bottom:22px}
.ps .dots{display:flex;gap:16px;margin-bottom:46px}.ps .dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%}.ps .dots i.on{background:#fff}
.ps .dots.shake{animation:shake .45s}
.ps .pad{display:grid;grid-template-columns:repeat(3,76px);gap:15px 24px}
.ps .k{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .15s}
.ps .k:active{background:rgba(255,255,255,.4)}.ps .k b{font-size:34px;font-weight:400}.ps .k small{font-size:9px;letter-spacing:2px;margin-top:3px;height:9px}
.ps .pb{position:absolute;bottom:60px;left:0;right:0;padding:0 46px;display:flex;justify-content:space-between;font-size:16px}
.ps .hs{position:absolute;inset:0;padding:64px 18px 0}
.ps .wrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.ps .wg{height:158px;border-radius:24px;padding:15px 16px;display:flex;flex-direction:column}
.ps .w1{background:linear-gradient(160deg,#2f78c4,#8cc0ee);color:#fff}.ps .w2{background:rgba(255,255,255,.92);color:#222}
.ps .wg small{font-size:15px;font-weight:600}.ps .wg b{font-size:44px;font-weight:300;line-height:1.1}.ps .wg span{margin-top:auto;font-size:13px}.ps .wg em{font-style:normal;font-size:12px;opacity:.8}
.ps .w2 small{color:#e5453c;text-transform:uppercase}.ps .w2 b{font-size:54px;font-weight:300}
.ps .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.ps .app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ps .app:active .ia{transform:scale(.88);filter:brightness(.85)}
.ps .ia{width:61px;height:61px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:31px;position:relative;transition:transform .15s,filter .15s;box-shadow:0 1px 3px #0003}
.ps .ia.igi{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ps .al{font-size:12px;color:#fff;text-shadow:0 1px 4px #0006;white-space:nowrap}
.ps .bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-style:normal;font-weight:600;display:grid;place-items:center;padding:0 6px;border:0;font-family:inherit}
.ps .pdots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:9px}.ps .pdots i{width:7px;height:7px;border-radius:50%;background:#fff6}.ps .pdots i.on{background:#fff}
.ps .dock{position:absolute;bottom:26px;left:12px;right:12px;height:94px;border-radius:34px;background:rgba(255,255,255,.28);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.ps .dock .al{display:none}.ps .dock .app{gap:0}
.ps .ig{position:absolute;inset:0;background:#0c1014;display:flex;flex-direction:column}
.ps .ig.opening{animation:appin .32s cubic-bezier(.2,.8,.3,1)}
.ps .pg{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:var(--top);position:relative}
.ps .sc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.ps .sc::-webkit-scrollbar{display:none}

};function fitDevice(dev,pad,allowFull){
